services:
  varynx-platform:
    build:
      context: ..
      dockerfile: deployment/Dockerfile

    container_name: varynx-platform

    ports:
      - "8001:8000"

    environment:
      VARYNX_SERVICE_NAME: varynx-platform
      VARYNX_ENVIRONMENT: container
      VARYNX_HOST: 0.0.0.0
      VARYNX_PORT: 8000
      VARYNX_LOG_LEVEL: INFO
      VARYNX_METRICS_ENABLED: "true"
      VARYNX_DATABASE_PATH: /app/aegisguard.db

    volumes:
      - ../aegisguard.db:/app/aegisguard.db

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s